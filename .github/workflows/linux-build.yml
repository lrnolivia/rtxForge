name: Build rtxForge Linux

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: rtxforge-linux-main
  cancel-in-progress: true

jobs:
  build-appimage:
    name: Bazzite x86_64 AppImage
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout rtxForge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            squashfs-tools \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-graphene-1.0 \
            gir1.2-gdkpixbuf-2.0 \
            xvfb \
            xauth \
            dbus-x11

      - name: Validate Python and engine behavior
        shell: bash
        run: |
          set -euo pipefail

          /usr/bin/python3 -m py_compile \
            engine/rtxengine.py \
            scripts/engine_bridge.py \
            scripts/desktop_service.py \
            scripts/library_media.py \
            scripts/app_update.py \
            scripts/desktop_install.py \
            gui/rtxforge_gtk.py

          /usr/bin/python3 -m unittest \
            engine.tests.test_v13_core_hardening

          git diff --check HEAD^ HEAD

      - name: Validate GTK desktop smoke
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          dbus-run-session -- \
            xvfb-run -a \
            /usr/bin/python3 gui/rtxforge_gtk.py --smoke-test

          for image in \
            gnome-library.png \
            gnome-game-settings.png \
            gnome-settings.png \
            gnome-progress.png \
            gnome-complete.png
          do
            test -s "dist/$image"
          done

      - name: Show build identity
        run: |
          echo "Building rtxForge $(cat VERSION)"
          git rev-parse HEAD

      - name: Build AppImage
        run: |
          python3 packaging/build_appimage.py

      - name: Verify versioned AppImage
        run: |
          cd dist
          sha256sum -c RTXForge-*.AppImage.sha256

      - name: Create updater assets
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          VERSIONED="dist/RTXForge-${VERSION}-Bazzite-x86_64.AppImage"
          UPDATE="dist/rtxForge-Bazzite-x86_64.AppImage"

          test -f "$VERSIONED"

          cp "$VERSIONED" "$UPDATE"
          chmod +x "$UPDATE"

          SHA="$(sha256sum "$UPDATE" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$UPDATE")"

          printf '%s  %s\n' \
            "$SHA" \
            "$(basename "$UPDATE")" \
            > "${UPDATE}.sha256"

          python3 - "$VERSION" "$SHA" "$SIZE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          version, sha256, size = sys.argv[1:]

          manifest = {
              'channel': 'continuous',
              'version': version,
              'commit': os.environ['GITHUB_SHA'],
              'appimage': 'rtxForge-Bazzite-x86_64.AppImage',
              'sha256': sha256,
              'size': int(size),
          }

          Path('dist/rtxforge-update.json').write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  sort_keys=True,
              ) + '\n'
          )
          PY

      - name: Verify updater AppImage
        run: |
          cd dist
          sha256sum -c rtxForge-Bazzite-x86_64.AppImage.sha256
          cat rtxforge-update.json

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtxForge-Bazzite-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/RTXForge-*.AppImage
            dist/RTXForge-*.AppImage.sha256
            dist/rtxForge-Bazzite-x86_64.AppImage
            dist/rtxForge-Bazzite-x86_64.AppImage.sha256
            dist/rtxforge-update.json

      - name: Publish continuous updater release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag -f continuous "$GITHUB_SHA"
          git push -f origin refs/tags/continuous

          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous \
              --title "rtxForge Continuous" \
              --prerelease \
              --notes "Automatic verified AppImage build from main: $GITHUB_SHA"
          else
            gh release create continuous \
              --title "rtxForge Continuous" \
              --prerelease \
              --notes "Automatic verified AppImage build from main: $GITHUB_SHA"
          fi

          gh release upload continuous \
            dist/rtxForge-Bazzite-x86_64.AppImage \
            dist/rtxForge-Bazzite-x86_64.AppImage.sha256 \
            dist/rtxforge-update.json \
            --clobber

      - name: Publish versioned release if missing
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(cat VERSION)"
          TAG="v${VERSION}"

          VERSIONED="dist/RTXForge-${VERSION}-Bazzite-x86_64.AppImage"
          CHECKSUM="${VERSIONED}.sha256"
          NOTES="docs/RELEASE-${VERSION}.md"

          test -s "$VERSIONED"
          test -s "$CHECKSUM"
          test -s "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving permanent release unchanged."
            exit 0
          fi

          gh release create "$TAG" \
            "$VERSIONED" \
            "$CHECKSUM" \
            --target "$GITHUB_SHA" \
            --title "rtxForge ${VERSION}" \
            --notes-file "$NOTES"
