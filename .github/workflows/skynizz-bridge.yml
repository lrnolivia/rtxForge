name: Skynizz NR and Ada MFG bridge
on:
  # Application CI builds and bundles this dependency. This is a manual source-only lane.
  workflow_dispatch:
    inputs:
      placement_candidate:
        description: Build the isolated NR placement candidate (never the app default)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: skynizz-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bridge:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Skynizz/optiscaler-dlss5
          ref: 6bfc4389c25054ef6747df6e6b1b470e9541c4da
          submodules: recursive
          persist-credentials: false
          path: windows/out/skynizz-source
      - uses: microsoft/setup-msbuild@v2
      - name: Build the exact combined source and NR forwarder
        shell: pwsh
        run: |
          $arguments = @{ SourceRoot = 'windows/out/skynizz-source' }
          if ('${{ inputs.placement_candidate }}' -eq 'true') { $arguments.PlacementCandidate = $true }
          ./windows/build/Build-SkynizzBridge.ps1 @arguments
      - uses: actions/upload-artifact@v4
        with:
          name: skynizz-nr-mfg-candidate
          path: |
            windows/out/skynizz-bridge/*.zip
            windows/out/skynizz-bridge/package.json
            windows/out/skynizz-placement-candidate/*.zip
            windows/out/skynizz-placement-candidate/package.json
          if-no-files-found: error
          retention-days: 14
