name: Game Mode native builds
on:
  pull_request:
    paths: ['prototypes/game-mode-tauri/**', '.github/workflows/game-mode-preview.yml', 'engine/**', 'scripts/**', 'providers/**', 'windows/engine-host/**']
  push:
    branches: [main, 'rtxforge/tauri-game-mode-*']
    paths: ['prototypes/game-mode-tauri/**', '.github/workflows/game-mode-preview.yml', 'engine/**', 'scripts/**', 'providers/**', 'windows/engine-host/**']
  workflow_dispatch:
  workflow_call:
    inputs:
      platforms:
        type: string
        default: '["windows-2025", "ubuntu-22.04"]'
permissions:
  contents: read
concurrency:
  group: game-mode-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms || '["windows-2025", "ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: prototypes/game-mode-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: prototypes/game-mode-tauri/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf squashfs-tools xvfb xauth
      - run: npm ci
      - name: Unit and engine adapter tests
        run: |
          npm run check
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Current interface and reviewed operation flow
        if: runner.os == 'Linux'
        env:
          RTXFORGE_UI_URL: http://127.0.0.1:1434
          RTXFORGE_UI_FIXTURE: '1'
          RTXFORGE_PREVIEW_READ_ONLY: '1'
        run: |
          npx playwright install --with-deps chromium
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 1434 --strictPort --configLoader native > "$RUNNER_TEMP/ui-server.log" 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:1434/ >/dev/null && break; sleep 1; done
          node tests/integration-ui.mjs
          node tests/install-flow.mjs
      - name: Build offline screenshot worker
        shell: bash
        run: |
          python -m pip install -r screening-requirements.txt
          python build_screening.py --output "$RUNNER_TEMP/screening-build"
      - name: Build native application
        shell: bash
        run: |
          npm run tauri -- build --no-bundle
          python package_bundle.py --record-native
      - name: Windows complete payload and host smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Build-Portable.ps1 -SkipBuild -OutputPath "$env:RUNNER_TEMP/package" -ScreeningPath "$env:RUNNER_TEMP/screening-build/dist/rtxforge-screenshot-screen"
      - name: Linux complete payload and host smoke
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python package_bundle.py --output "$RUNNER_TEMP/package" --screening "$RUNNER_TEMP/screening-build/dist/rtxforge-screenshot-screen"
      - name: Bundle Linux webview and private runtime
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python bundle_appimage.py --payload "$RUNNER_TEMP/package" --output "$RUNNER_TEMP/game-mode-appimage"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: rtxForge-Game-Mode-linux-appimage-${{ github.sha }}
          path: ${{ runner.temp }}/game-mode-appimage
          retention-days: 14
      - name: Preserve Linux executable modes and runtime links
        if: runner.os == 'Linux'
        run: tar -czf "$RUNNER_TEMP/rtxForge-Game-Mode-linux-x64.tar.gz" -C "$RUNNER_TEMP/package" .
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: rtxForge-Game-Mode-linux-x64-${{ github.sha }}
          path: ${{ runner.temp }}/rtxForge-Game-Mode-linux-x64.tar.gz
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: rtxForge-Game-Mode-win-x64-${{ github.sha }}
          path: ${{ runner.temp }}/package
          retention-days: 14
