name: Beta compatibility report
description: Share a working setup, installation failure, or in-game NR / MFG result.
title: "[Beta report] "
body:
  - type: markdown
    attributes:
      value: |
        Tell us what happened. Fill in what you know; leave anything else blank.

        [Search existing reports](https://github.com/lrnolivia/rtxForge/issues?q=is%3Aissue%20%22%5BBeta%20report%5D%22) or check the [setup guide](https://loew.fi/rtxforge/install) if you’re stuck. For an AppImage that won’t open, check its [system requirements](https://loew.fi/rtxforge/install?os=linux#appimage).

        Good results are welcome too. Installing files alone doesn’t confirm NR or MFG works in-game.
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: Linux or Windows
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distro / OS version
      placeholder: SteamOS, Bazzite, CachyOS, another distro, or Windows — include version
    validations:
      required: false
  - type: input
    id: gpu-series
    attributes:
      label: RTX series
      placeholder: RTX 20, 30, 40, 50, Other, or Not sure
    validations:
      required: false
  - type: input
    id: gpu
    attributes:
      label: GPU model and driver
      placeholder: Exact GPU model and NVIDIA driver version
    validations:
      required: false
  - type: input
    id: app-format
    attributes:
      label: rtxForge app format
      placeholder: Flatpak, AppImage, Windows installer, Windows portable ZIP, or source / other
    validations:
      required: false
  - type: input
    id: app-build
    attributes:
      label: rtxForge version / channel
      placeholder: Version and Beta or Development; download filename if known
    validations:
      required: false
  - type: input
    id: game
    attributes:
      label: Game and version
      placeholder: Game title and version, or Not reached
    validations:
      required: false
  - type: input
    id: feature-package
    attributes:
      label: Game package
      description: The name shown in Packages. Add the version or custom ZIP source if you know it.
    validations:
      required: false
  - type: input
    id: features
    attributes:
      label: Features attempted
      placeholder: NR only, MFG only, NR + MFG, or Not reached / Not sure
    validations:
      required: false
  - type: input
    id: nr-result
    attributes:
      label: NR result
      placeholder: Working in-game, Not working in-game, Installed but not tested, Could not install, Not installed, or Not sure
    validations:
      required: false
  - type: input
    id: mfg-result
    attributes:
      label: MFG result
      placeholder: Working in-game, Not working in-game, Installed but not tested, Could not install, Not installed, or Not sure
    validations:
      required: false
  - type: textarea
    id: observations
    attributes:
      label: What happened?
      description: What were you doing, what did you expect, and what did you see? An error message or Proton version can help.
      placeholder: What did you do, what did you expect, and what did you see?
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Logs can be added later to this issue. To export them, use **Settings → Recovery → Library Reports → Preview Support Report** in the app and check the contents before sharing.
  - type: upload
    id: support-archive
    attributes:
      label: Reviewed support report / logs (optional)
      description: Attach your redacted ZIP here (under 25 MB). Files upload when attached and are public in this repository, so check their contents first.
    validations:
      required: false
      accept: ".zip,.log,.txt,.json"
