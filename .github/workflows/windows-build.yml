name: Legacy RTXForge loader R&D

# Historical custom-loader workbench.
# This is not part of the production Linux/AppImage pipeline.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: rtxforge
      - uses: actions/checkout@v4
        with:
          repository: y4my4my4m/OptiScaler_DLSSNR_Multipass_MFG
          ref: 7b7220bbb4994a9c8ae60cfc75a44cb67995efb8
          submodules: recursive
          path: upstream
      - uses: microsoft/setup-msbuild@v2
      - name: Apply bounded menu patch
        run: python rtxforge/build/patch_panel.py upstream
      - name: Build unsigned x64 loader sequentially
        working-directory: upstream
        run: msbuild OptiScaler.sln /m:1 /p:Configuration=Release /p:Platform=x64 /p:MultiProcessorCompilation=false /verbosity:minimal
      - name: Record identity
        shell: pwsh
        run: |
          $dll = 'upstream/x64/Release/a/OptiScaler.dll'
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLower()
          @{ schema=1; policy='RTXForge.NrPanel.v1'; upstream_commit='7b7220bbb4994a9c8ae60cfc75a44cb67995efb8'; sha256=$hash } | ConvertTo-Json | Set-Content upstream/x64/Release/a/rtxforge-loader.json
      - uses: actions/upload-artifact@v4
        with:
          name: rtxforge-loader
          if-no-files-found: error
          path: |
            upstream/x64/Release/a/OptiScaler.dll
            upstream/x64/Release/a/rtxforge-loader.json
