name: Build rtxForge Windows

on:
  workflow_dispatch:
    inputs:
      draft_release:
        description: Attach the installers to a DRAFT GitHub release (nothing is published until a maintainer publishes the draft)
        type: boolean
        default: false
      publish_beta:
        description: Publish 1.0 Beta with installers and portable (reviewed main only)
        type: boolean
        default: false
      expected_sha:
        description: Exact reviewed main commit required when publishing Beta
        type: string
        default: ''
  push:
    branches:
      - main
    paths:
      - windows/**
      - engine/**
      - scripts/**
      - providers/**
      - tests/**
      - provider.json
      - gui/fonts/**
      - gui/icons/**
      - VERSION
      - .github/workflows/windows-build.yml
  pull_request:
    paths:
      - windows/**
      - engine/**
      - scripts/**
      - providers/**
      - tests/**
      - provider.json
      - gui/fonts/**
      - gui/icons/**
      - VERSION
      - .github/workflows/windows-build.yml

permissions:
  contents: read

concurrency:
  group: rtxforge-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel-candidate:
    name: In-game panel candidate
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Validate explicit Beta publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_beta
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DRAFT_RELEASE: ${{ inputs.draft_release }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Beta publication requires reviewed main' }
          if ($env:EXPECTED_SHA -ne $env:GITHUB_SHA) { throw 'Main changed; review its exact commit before publishing' }
          if ($env:DRAFT_RELEASE -eq 'true') { throw 'Choose either draft_release or publish_beta' }
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Skynizz/optiscaler-dlss5
          ref: fc702f8ca22f97b01bd6a02f3386bffb3484fc35
          submodules: recursive
          persist-credentials: false
          path: windows/out/skynizz-source
      - uses: microsoft/setup-msbuild@v2
      - name: Build isolated renderer candidate
        run: ./windows/build/Build-SkynizzBridge.ps1 -SourceRoot windows/out/skynizz-source -PanelCandidate
      - uses: actions/upload-artifact@v4
        with:
          name: skynizz-in-game-panel-candidate
          path: |
            windows/out/skynizz-panel-candidate/*.zip
            windows/out/skynizz-panel-candidate/package.json
          if-no-files-found: error
          retention-days: 14
  build:
    name: WinUI 3 ${{ matrix.platform }}
    needs: panel-candidate
    runs-on: windows-2025
    # Signed release runs wait for the SignPath approval (up to an hour per request).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            arch: x64
          - platform: ARM64
            rid: win-arm64
            arch: arm64

    # actions: read lets SignPath fetch the unsigned artifacts it is asked to sign.
    permissions:
      contents: read
      actions: read

    env:
      PROJECT: windows/RtxForge.Windows/RtxForge.Windows.csproj
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Explicit manual release runs are signed through SignPath once it is
      # configured (see windows/README.md); every other run stays unsigned.
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && github.event_name == 'workflow_dispatch' && (inputs.draft_release || inputs.publish_beta) }}

    steps:
      - name: Checkout rtxForge
        uses: actions/checkout@v4

      - name: Bundle the matching in-game overlay bridge
        if: matrix.platform == 'x64'
        uses: actions/download-artifact@v4
        with:
          name: skynizz-in-game-panel-candidate
          path: windows/out/skynizz-bridge

      # The Feeder panel hosts the same ForgePanel.h with OptiScaler's Dear ImGui and FreeType.
      - name: Check out the admitted OptiScaler source for the Feeder panel
        if: matrix.platform == 'x64'
        uses: actions/checkout@v4
        with:
          repository: Skynizz/optiscaler-dlss5
          ref: fc702f8ca22f97b01bd6a02f3386bffb3484fc35
          persist-credentials: false
          path: windows/out/skynizz-source

      - name: Build the Feeder NR in-game panel
        if: matrix.platform == 'x64'
        run: ./windows/build/Build-FeederPanel.ps1 -SourceRoot windows/out/skynizz-source

      - name: Bundle the reviewed native Vulkan package and NR model
        if: matrix.platform == 'x64'
        run: ./windows/build/Build-VulkanProvider.ps1

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Verify shared Windows settings compatibility
        if: matrix.platform == 'x64'
        run: |
          dotnet run --project windows/tests/Settings/Settings.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project windows/tests/OverlayWindow/OverlayWindow.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project windows/tests/NativePanelChannel/NativePanelChannel.csproj -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project windows/tests/LibrarySnapshot/LibrarySnapshot.csproj -c Release

      - name: Verify Skynizz package and active Windows lifecycle
        if: matrix.platform == 'x64'
        run: |
          python -X utf8 -m unittest discover -s tests -p test_ada_mfg_provider.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s tests -p test_skynizz_provider.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s tests -p test_skynizz_bridge.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_processes.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_library_scan.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_discovery_inventory.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_companion_controls.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s tests -p test_overlay_policy.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_overlay_ui.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest tests.test_overlay_settings tests.test_vulkan_app_routes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_global_controls.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_app_storage.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_package_adoption.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_game_display.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
            python -X utf8 -m unittest discover -s windows/tests -p test_review_copy.py
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s tests -p test_feeder_provider.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_feeder_provider.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
            python -X utf8 -m unittest discover -s windows/tests -p test_dlss_updates.py
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_install_prefetch.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 tests/test_runtime_updates.py CatalogReuseTest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_app_update.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 tests/test_app_update.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_skynizz_provider.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -X utf8 -m unittest discover -s windows/tests -p test_overlay_packages.py
          python -X utf8 -m unittest discover -s tests -p test_universal_mfg_provider.py
          python -X utf8 -m unittest discover -s windows/tests -p test_durable_restore.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Restore
        run: dotnet restore $env:PROJECT -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build $env:PROJECT -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} --no-restore

      # Publish also bundles the engine and a private Python (windows/build/Bundle-Engine.ps1).
      - name: Publish self-contained app
        run: |
          $log = dotnet publish $env:PROJECT -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} -p:SelfContained=true -o out/rtxForge-windows-${{ matrix.arch }} 2>&1
          $code = $LASTEXITCODE
          $log
          if ($code) {
            # Annotations are readable without signing in to the job log.
            $log | Select-Object -Last 25 | ForEach-Object { "::error title=publish::$_" }
            exit $code
          }

      # ARM64 Python cannot run on the x64 runner; its bundle is checked for files by Build-Installer.ps1.
      - name: Smoke-test the bundled engine
        if: matrix.platform == 'x64'
        run: |
          $app = 'out/rtxForge-windows-x64'
          $env:RTXFORGE_ROOT = (Resolve-Path "$app/engine").Path
          $reply = '{"id":1,"method":"hello"}' | & "$app/python/python.exe" -I -B -u "$app/engine/windows/engine-host/rtxforge_win_host.py"
          $reply
          if (-not ($reply | Select-String '"id": 1, "result"')) { throw 'Bundled engine host did not answer' }

      # Only rtxForge's own binaries: the Windows App SDK and Python files are already signed by their publishers.
      - name: Upload the app for signing
        id: unsigned-app
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-${{ matrix.arch }}
          retention-days: 1
          path: |
            out/rtxForge-windows-${{ matrix.arch }}/rtxForge.exe
            out/rtxForge-windows-${{ matrix.arch }}/rtxForge.dll

      # SignPath waits for a maintainer to approve the request before it signs.
      - name: Sign the app (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'rtxForge' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: out/signed-app-${{ matrix.arch }}

      - name: Use the signed app
        if: env.SIGN == 'true'
        run: Copy-Item out/signed-app-${{ matrix.arch }}/* out/rtxForge-windows-${{ matrix.arch }}/ -Force

      - name: Build installer
        run: ./windows/build/Build-Installer.ps1 -RuntimeIdentifier ${{ matrix.rid }} -PublishDir out/rtxForge-windows-${{ matrix.arch }} -Output out/installer

      - name: Upload the installer for signing
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer-${{ matrix.arch }}
          retention-days: 1
          path: out/installer/rtxForge-Setup-*.exe

      - name: Sign the installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'rtxForge' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: windows-installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: out/signed-installer

      - name: Use the signed installer
        if: env.SIGN == 'true'
        run: Copy-Item out/signed-installer/*.exe out/installer/ -Force

      # Signing changes the bytes: checksums are written after it.
      - name: Write checksums
        run: |
          Get-ChildItem out/installer -Filter 'rtxForge-Setup-*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
            if ($env:SIGN -eq 'true') {
              $signature = Get-AuthenticodeSignature $_.FullName
              if ($signature.Status -ne 'Valid') { throw "$($_.Name) signature: $($signature.Status)" }
            }
          }

      # Install silently into a temp folder, start the installed engine, then uninstall.
      - name: Smoke-test the installer
        if: matrix.platform == 'x64'
        run: |
          $setup = Get-ChildItem out/installer -Filter 'rtxForge-Setup-*.exe' | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP 'rtxForge-install'
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode) { throw "Setup exited $($p.ExitCode)" }
          $env:RTXFORGE_ROOT = "$dir\engine"
          $reply = '{"id":1,"method":"hello"}' | & "$dir\python\python.exe" -I -B -u "$dir\engine\windows\engine-host\rtxforge_win_host.py"
          if (-not ($reply | Select-String '"id": 1, "result"')) { throw 'Installed engine host did not answer' }
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode) { throw "Uninstall exited $($p.ExitCode)" }
          Start-Sleep 3
          if (Test-Path "$dir\rtxForge.exe") { throw 'Uninstall left the app behind' }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: rtxForge-Setup-windows-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            out/installer/rtxForge-Setup-*.exe
            out/installer/rtxForge-Setup-*.exe.sha256

      - name: Upload portable app
        if: matrix.platform == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: rtxForge-windows-x64
          path: out/rtxForge-windows-x64
          retention-days: 14

  # Opt-in only: a maintainer runs the workflow with draft_release. The release
  # stays a draft (invisible to users) until it is reviewed and published by hand.
  draft-release:
    name: Draft release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout rtxForge
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: rtxForge-Setup-windows-*
          merge-multiple: true
          path: installers

      - name: Create or update the draft
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="windows-v$VERSION"
          if [ "$SIGNED" = "true" ]; then
            SIGNING="Signed by SignPath Foundation (free code signing for open source, see CODE_SIGNING.md); until the certificate builds reputation, Windows SmartScreen may still ask you to confirm (More info > Run anyway)."
          else
            SIGNING="This build is not code-signed, so Windows SmartScreen may ask you to confirm (More info > Run anyway)."
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "$TAG is already published; refusing to change it." >&2
              exit 1
            fi
            gh release upload "$TAG" installers/* --clobber
          else
            gh release create "$TAG" installers/* \
              --draft \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "rtxForge for Windows $VERSION" \
              --notes "rtxForge for Windows $VERSION ($GITHUB_SHA). Download rtxForge-Setup-$VERSION-x64.exe (or -arm64 for Windows on Arm). Python and the rtxForge engine are bundled; nothing else to install. $SIGNING SHA-256 checksums are attached."

  publish-beta:
    name: Publish Windows Beta
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish_beta && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified installers
        uses: actions/download-artifact@v4
        with:
          pattern: rtxForge-Setup-windows-*
          merge-multiple: true
          path: release
      - name: Download portable app
        uses: actions/download-artifact@v4
        with:
          name: rtxForge-windows-x64
          path: portable/rtxForge-windows-x64
      - name: Package and publish exact build
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$VERSION" = "1.0.0-beta.1"
          test -f "release/rtxForge-Setup-$VERSION-x64.exe"
          test -f "release/rtxForge-Setup-$VERSION-arm64.exe"
          test -f portable/rtxForge-windows-x64/rtxForge.exe
          test -f portable/rtxForge-windows-x64/python/python.exe
          test -f portable/rtxForge-windows-x64/engine/windows/engine-host/rtxforge_win_host.py
          (cd release && sha256sum -c ./*.sha256)
          ROOT="$PWD"
          (cd portable && zip -q -r "$ROOT/release/rtxForge-windows-$VERSION-x64.zip" rtxForge-windows-x64)
          (cd release && sha256sum "rtxForge-windows-$VERSION-x64.zip" > "rtxForge-windows-$VERSION-x64.zip.sha256")
          cp docs/releases/1.0-beta.md "$RUNNER_TEMP/beta-notes.md"
          if [ "$SIGNED" = "true" ]; then
            printf '\nWindows binaries are signed through SignPath.\n' >> "$RUNNER_TEMP/beta-notes.md"
          else
            printf '\nThis build is unsigned. Windows SmartScreen may ask for confirmation.\n' >> "$RUNNER_TEMP/beta-notes.md"
          fi
          printf '\nVersion: `%s` · Source: `%s` · [Build](https://github.com/%s/actions/runs/%s)\n' "$VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/beta-notes.md"
          # Never replace a published channel or its rollback assets implicitly.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/beta" > "$RUNNER_TEMP/existing-beta.json" 2> "$RUNNER_TEMP/beta-lookup-error"; then
            echo 'Beta already exists; refusing to overwrite it.' >&2
            exit 1
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/beta-lookup-error"; then
            cat "$RUNNER_TEMP/beta-lookup-error" >&2
            exit 1
          fi
          gh release create beta release/* --draft --prerelease --target "$GITHUB_SHA" --title 'rtxForge 1.0 Beta' --notes-file "$RUNNER_TEMP/beta-notes.md"
          test "$(gh release view beta --json assets --jq '.assets | length')" = 6
          gh release edit beta --draft=false --prerelease --latest=false
          fi
