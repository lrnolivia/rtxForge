name: Package UI review
on:
  pull_request:
    paths: ['gui/**', 'scripts/**', 'engine/**', 'tests/**', '.github/workflows/package-ui-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-review:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - run: dnf install -y git python3 python3-pytest sdl2-compat python3-gobject gobject-introspection gtk4 libadwaita graphene gdk-pixbuf2 adwaita-icon-theme adwaita-sans-fonts squashfs-tools xorg-x11-server-Xvfb dbus-daemon
      - uses: actions/checkout@v4
      - name: Validate package engine and syntax
        run: |
          python3 -m compileall -q scripts gui engine
          python3 -m pytest tests/test_app_completion.py tests/test_controller_native.py tests/test_desktop_service.py tests/test_runtime_updates.py tests/test_per_game_presets.py tests/test_package_catalog.py tests/test_package_download.py tests/test_package_cache.py tests/test_frontend_session.py tests/test_setup.py tests/test_operation_finalization.py tests/test_ui_colors.py tests/test_ui_scaling.py -q
          python3 -m unittest engine.tests.test_v13_core_hardening
      - name: Capture both real native layouts without game writes
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
          GTK_A11Y: none
          HOME: /tmp/rtxforge-review-home
        run: |
          mkdir -p "$HOME" dist
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' python3 tests/ui_package_review.py
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' python3 tests/ui_app_completion.py
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' python3 tests/ui_couch_review.py
          dbus-run-session -- xvfb-run -a -s '-screen 0 3840x2160x24' python3 tests/ui_layout_scaling.py
      - name: Build isolated review AppImage
        run: |
          python3 packaging/build_appimage.py
          python3 - <<'PYBUILD'
          import json, os
          from pathlib import Path
          data=json.loads(Path('dist/AppImage-build/RTXForge.AppDir/usr/share/rtxforge/BUILD_INFO.json').read_text())
          assert data['commit']==os.environ['GITHUB_SHA']
          for name in ['gui/package_browser.py','gui/native_shell.py','gui/couch_shell.py','gui/ui_scaling.py','gui/qt/Main.qml','scripts/package_catalog.py','scripts/desktop_frontend.py','scripts/controller_input.py','scripts/extra_tools.py','scripts/runtime_diagnostics.py']:
              assert (Path('dist/AppImage-build/RTXForge.AppDir/usr/share/rtxforge')/name).is_file(),name
          PYBUILD
      - name: Verify packaged GTK entrypoint and protected flows
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
          GTK_A11Y: none
          HOME: /tmp/rtxforge-packaged-review
        run: |
          mkdir -p "$HOME"
          export APPDIR="$PWD/dist/AppImage-build/RTXForge.AppDir"
          "$APPDIR/AppRun" --frontend-doctor
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session "$APPDIR/AppRun" --demo --smoke-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtxforge-native-package-review
          path: |
            dist/*.png
            dist/*.json
            dist/*.AppImage
            dist/*.sha256
          retention-days: 7

  kde-review:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - run: dnf install -y git python3 python3-pyside6 kf6-kirigami kf6-qqc2-desktop-style qt6-qtdeclarative qt6-qtsvg breeze-icon-theme xorg-x11-server-Xvfb dbus-daemon
      - uses: actions/checkout@v4
      - name: Native Qt layouts share one service
        env:
          QT_QUICK_BACKEND: software
          HOME: /tmp/rtxforge-qt-home
        run: |
          mkdir -p "$HOME" dist
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session python3 gui/qt/app.py --smoke-test
          test -s dist/kde-classic.png
          test -s dist/kde-new.png
          test -s dist/kde-packages.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtxforge-kde-review
          path: dist/
          retention-days: 7

  wayland-review:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - run: dnf install -y git python3 python3-gobject gtk4 libadwaita graphene gdk-pixbuf2 adwaita-icon-theme adwaita-sans-fonts python3-pyside6 kf6-kirigami kf6-qqc2-desktop-style qt6-qtdeclarative qt6-qtsvg qt6-qtwayland breeze-icon-theme weston dbus-daemon
      - uses: actions/checkout@v4
      - name: Exercise both toolkits on a real headless Wayland compositor
        env:
          GDK_BACKEND: wayland
          GSK_RENDERER: cairo
          QT_QPA_PLATFORM: wayland
          QT_QUICK_BACKEND: software
          GTK_A11Y: none
          HOME: /tmp/rtxforge-wayland-home
          XDG_RUNTIME_DIR: /tmp/rtxforge-wayland-runtime
          WAYLAND_DISPLAY: wayland-review
        run: |
          mkdir -p "$HOME" "$XDG_RUNTIME_DIR" dist
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session bash -c '
            set -e
            weston -B headless --renderer=pixman --socket="$WAYLAND_DISPLAY" --width=1920 --height=1080 --idle-time=0 --no-config > dist/weston.log 2>&1 &
            weston_pid=$!
            trap "kill $weston_pid 2>/dev/null || true" EXIT
            for n in $(seq 1 30); do
              test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" && break
              kill -0 "$weston_pid" || { cat dist/weston.log; exit 1; }
              sleep 1
            done
            test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
            python3 tests/ui_package_review.py
            python3 gui/qt/app.py --smoke-test
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtxforge-wayland-review
          path: |
            dist/*.png
            dist/*.json
            dist/weston.log
          retention-days: 7
