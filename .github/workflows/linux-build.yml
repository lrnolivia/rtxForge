name: Build rtxForge Linux

on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish this reviewed branch to the continuous preview updater
        type: boolean
        default: false
      publish_beta:
        description: Publish the Linux AppImage to 1.0 Beta (reviewed main only)
        type: boolean
        default: false
      expected_sha:
        description: Exact reviewed main commit required when publishing Beta
        type: string
        default: ''

  push:
    branches:
      - main
  # Reviews run the same validation and AppImage build; publishing stays manual.
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  RTXFORGE_REQUIRE_GLASS: '1'

# Pushes and pull requests cancel their own older runs; nothing cancels a manual publication.
concurrency:
  group: rtxforge-linux-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  panel-candidate:
    uses: ./.github/workflows/overlay-native.yml
  build-appimage:
    needs: panel-candidate
    name: Bazzite x86_64 AppImage
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate explicit Beta publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_beta
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PUBLISH_PREVIEW: ${{ inputs.publish_preview }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main || { echo 'Beta publication requires reviewed main' >&2; exit 1; }
          test "$EXPECTED_SHA" = "$GITHUB_SHA" || { echo 'Main changed; review its exact commit before publishing' >&2; exit 1; }
          test "$PUBLISH_PREVIEW" != true || { echo 'Choose either publish_preview or publish_beta' >&2; exit 1; }

      - name: Install Fedora 44 build and validation dependencies
        run: |
          set -euo pipefail
          dnf install -y \
            ca-certificates \
            git \
            gh \
            python3 \
            python3-gobject \
            python3-pyyaml \
            gobject-introspection \
            gtk4 \
            libadwaita \
            graphene \
            gdk-pixbuf2 \
            adwaita-icon-theme \
            adwaita-sans-fonts \
            squashfs-tools \
            xorg-x11-server-Xvfb \
            dbus-daemon

      - name: Checkout rtxForge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download glass-overlay-candidate
        uses: actions/download-artifact@v4
        with:
          name: glass-overlay-candidate
          path: windows/out/glass-overlay
      - name: Download skynizz-in-game-panel-candidate
        uses: actions/download-artifact@v4
        with:
          name: skynizz-in-game-panel-candidate
          path: windows/out/skynizz-bridge
      - name: Download feeder-overlay-candidate
        uses: actions/download-artifact@v4
        with:
          name: feeder-overlay-candidate
          path: windows/out/feeder-panel

      - name: Trust checkout inside Fedora container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --show-toplevel
          git rev-parse HEAD

      - name: Validate Python and engine behavior
        run: |
          set -euo pipefail

          /usr/bin/python3 providers/vulkan-dlssg/distribution.py --output windows/out/vulkan-provider

          /usr/bin/python3 -m py_compile \
            engine/rtxengine.py \
            scripts/engine_bridge.py \
            scripts/desktop_service.py \
            scripts/library_media.py \
            scripts/app_update.py \
            scripts/desktop_install.py \
            scripts/runtime_updates.py \
            scripts/ui_colors.py \
            scripts/proton_stack.py \
            scripts/proton_mfg.py \
            scripts/proton_overlay.py \
            scripts/linux_runtime.py \
            scripts/flatpak_host.py \
            scripts/host_probe.py \
            packaging/build_flatpak.py \
            gui/rtxforge_gtk.py

          /usr/bin/python3 -m unittest \
            engine.tests.test_v13_core_hardening \
            tests.test_game_mode_motion
          /usr/bin/python3 -m unittest tests.test_overlay_settings tests.test_vulkan_app_routes tests.test_overlay_bundle tests.test_overlay_refresh tests.test_glass_preferences tests.test_package_downloads tests.test_game_mode_icons

          /usr/bin/python3 -m unittest discover -s tests -p test_runtime_updates.py
          /usr/bin/python3 -m unittest discover -s tests -p test_ui_colors.py
          /usr/bin/python3 -m unittest discover -s tests -p test_app_update.py
          /usr/bin/python3 tests/test_auto_update.py
          /usr/bin/python3 -m unittest discover -s tests -p test_operation_finalization.py
          /usr/bin/python3 -m unittest discover -s tests -p test_setup.py
          /usr/bin/python3 -m unittest discover -s tests -p test_package_download.py

          /usr/bin/python3 -m unittest discover -s tests -p test_release_backup.py
          /usr/bin/python3 -m unittest discover -s tests -p test_beta_release_workflows.py
          /usr/bin/python3 -m unittest discover -s tests -p test_cross_os_adapt.py
          /usr/bin/python3 -m unittest discover -s tests -p test_linux_skynizz_adoption.py
          /usr/bin/python3 -m unittest discover -s tests -p test_cross_distro.py
          /usr/bin/python3 -m unittest discover -s tests -p test_gpu_families.py
          /usr/bin/python3 -m unittest discover -s tests -p test_user_messages.py
          /usr/bin/python3 -m unittest tests.test_discovery_candidates tests.test_feeder_legacy tests.test_offline_routes
          /usr/bin/python3 -m unittest tests.test_beta_report tests.test_compat_list
          /usr/bin/python3 -m unittest tests.test_functional_test
          /usr/bin/python3 -m unittest discover -s tests/linux_runtime -p 'test_*.py'

          /usr/bin/python3 tests/test_batches.py
          /usr/bin/python3 tests/test_cleanup.py

          git show --format= --check HEAD

      - name: Validate GTK desktop smoke
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: "1"
          GTK_A11Y: "none"
          HOME: /tmp/rtxforge-smoke-home
        run: |
          set -euo pipefail

          cat /etc/fedora-release
          mkdir -p "$HOME" dist

          /usr/bin/python3 - <<'PY'
          import gi
          gi.require_version('Adw', '1')
          from gi.repository import Adw

          version = (
              Adw.get_major_version(),
              Adw.get_minor_version(),
              Adw.get_micro_version(),
          )
          print('libadwaita:', '.'.join(map(str, version)))
          assert hasattr(Adw, 'ToggleGroup'), 'Fedora 44 must provide Adw.ToggleGroup'
          PY

          dbus-run-session -- \
            xvfb-run -a \
            /usr/bin/python3 gui/rtxforge_gtk.py --smoke-test

          for image in \
            gnome-library.png \
            gnome-game-settings.png \
            gnome-settings.png \
            gnome-progress.png \
            gnome-complete.png
          do
            test -s "dist/$image"
          done

      - name: Show build identity
        run: |
          cat /etc/fedora-release
          echo "Building rtxForge $(cat VERSION)"
          git rev-parse HEAD

      - name: Verify native Game Mode motion
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
          GSETTINGS_BACKEND: memory
          PYTHONWARNINGS: ignore
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- python3 -m unittest tests.linux_ui.test_game_mode_motion_native

      - name: Verify Library-first resume
        env:
          GSK_RENDERER: cairo
          GTK_A11Y: none
          GSETTINGS_BACKEND: memory
          PYTHONWARNINGS: ignore
        run: |
          xvfb-run -a -s '-screen 0 1920x1080x24' dbus-run-session -- python3 tests/ui_library_resume.py
          test -s dist/resume-library-first.png

      - name: Build AppImage
        run: |
          python3 packaging/build_appimage.py
          python3 - <<'PYBUILD'
          import json, os
          from pathlib import Path
          info=json.loads(Path('dist/AppImage-build/RTXForge.AppDir/usr/share/rtxforge/BUILD_INFO.json').read_text())
          assert info['commit']==os.environ['GITHUB_SHA']
          PYBUILD

      - name: Verify versioned AppImage
        run: |
          cd dist
          sha256sum -c RTXForge-*.AppImage.sha256

      - name: Build verified Bazzite setup bundle
        run: python3 packaging/build_bundle.py

      - name: Create updater assets
        run: |
          VERSION="$(cat VERSION)"
          VERSIONED="dist/RTXForge-${VERSION}-Bazzite-x86_64.AppImage"
          UPDATE="dist/rtxForge-Bazzite-x86_64.AppImage"

          test -f "$VERSIONED"

          cp "$VERSIONED" "$UPDATE"
          chmod +x "$UPDATE"

          SHA="$(sha256sum "$UPDATE" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$UPDATE")"

          printf '%s  %s\n' \
            "$SHA" \
            "$(basename "$UPDATE")" \
            > "${UPDATE}.sha256"

          python3 - "$VERSION" "$SHA" "$SIZE" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          version, sha256, size = sys.argv[1:]

          manifest = {
              'channel': 'continuous',
              'version': version,
              'commit': os.environ['GITHUB_SHA'],
              'appimage': 'rtxForge-Bazzite-x86_64.AppImage',
              'sha256': sha256,
              'size': int(size),
          }

          Path('dist/rtxforge-update.json').write_text(
              json.dumps(
                  manifest,
                  indent=2,
                  sort_keys=True,
              ) + '\n'
          )
          PY

      - name: Verify updater AppImage
        run: |
          cd dist
          sha256sum -c rtxForge-Bazzite-x86_64.AppImage.sha256
          cat rtxforge-update.json

      - name: Create Beta assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish_beta
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^1\.0\.0-beta\.[0-9]+$ ]]
          APPIMAGE="rtxForge-${VERSION}-x86_64.AppImage"
          mkdir -p dist/beta
          cp "dist/RTXForge-${VERSION}-Bazzite-x86_64.AppImage" "dist/beta/$APPIMAGE"
          chmod +x "dist/beta/$APPIMAGE"
          (cd dist/beta && sha256sum "$APPIMAGE" > "$APPIMAGE.sha256")

          # Same schema as the continuous rtxforge-update.json, on the beta channel.
          python3 - "$VERSION" "$APPIMAGE" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          version, name = sys.argv[1:]
          data = Path('dist/beta', name).read_bytes()
          manifest = {
              'channel': 'beta',
              'version': version,
              'commit': os.environ['GITHUB_SHA'],
              'appimage': name,
              'sha256': hashlib.sha256(data).hexdigest(),
              'size': len(data),
          }
          Path('dist/beta/rtxforge-beta-linux.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n'
          )
          PY
          ls -l dist/beta

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtxForge-Bazzite-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/RTXForge-*.AppImage
            dist/RTXForge-*.AppImage.sha256
            dist/rtxForge-Bazzite-x86_64.AppImage
            dist/rtxForge-Bazzite-x86_64.AppImage.sha256
            dist/rtxforge-update.json
            dist/rtxForge-Bazzite-RTX4070-*.tar.gz
            dist/rtxForge-Bazzite-RTX4070-*.tar.gz.sha256
            dist/beta/

      - name: Publish continuous updater release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/rtxforge/shared-package-ui-20261002')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Keep rollback bytes in the existing channel; do not create historical refs.
          # This uses the existing contents permission and does not widen token access.
          gh release view continuous --json assets > /tmp/rtxforge-release-assets.json
          mkdir -p /tmp/rtxforge-current /tmp/rtxforge-backup /tmp/rtxforge-existing
          gh release download continuous --dir /tmp/rtxforge-current
          python3 scripts/prepare_release_backup.py /tmp/rtxforge-current /tmp/rtxforge-backup
          for FILE in /tmp/rtxforge-backup/*; do
            NAME="$(basename "$FILE")"
            if python3 -c 'import json,sys; sys.exit(0 if any(a["name"]==sys.argv[1] for a in json.load(open("/tmp/rtxforge-release-assets.json"))["assets"]) else 1)' "$NAME"; then
              gh release download continuous --pattern "$NAME" --dir /tmp/rtxforge-existing
              cmp "$FILE" "/tmp/rtxforge-existing/$NAME"
            else
              gh release upload continuous "$FILE"
            fi
          done

          CURRENT_TAG="$(git rev-parse refs/tags/continuous)"
          git tag -f continuous "$GITHUB_SHA"
          git push --force-with-lease="refs/tags/continuous:$CURRENT_TAG" origin refs/tags/continuous

          gh release edit continuous \
            --title "rtxForge Beta" \
            --prerelease \
            --notes "Verified development preview AppImage: $GITHUB_SHA. This moving prerelease is the rtxForge continuous update channel, not a numbered stable release. Verified previous updater files are retained as .previous assets."

          gh release upload continuous \
            dist/rtxForge-Bazzite-x86_64.AppImage \
            dist/rtxForge-Bazzite-x86_64.AppImage.sha256 \
            dist/rtxforge-update.json \
            --clobber

  # The Flatpak (SteamOS, and any system without GTK4/libadwaita) from the same
  # payload as the AppImage. Runs on the VM, not in a container: bubblewrap needs
  # user namespaces, and the checks below run the installed app like a user's system.
  build-flatpak:
    needs: panel-candidate
    name: Flatpak x86_64 bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout rtxForge
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download glass-overlay-candidate
        uses: actions/download-artifact@v4
        with:
          name: glass-overlay-candidate
          path: windows/out/glass-overlay
      - name: Download skynizz-in-game-panel-candidate
        uses: actions/download-artifact@v4
        with:
          name: skynizz-in-game-panel-candidate
          path: windows/out/skynizz-bridge
      - name: Download feeder-overlay-candidate
        uses: actions/download-artifact@v4
        with:
          name: feeder-overlay-candidate
          path: windows/out/feeder-panel

      - name: Install Flatpak tooling and the GNOME 51 runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb imagemagick
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//51 org.gnome.Sdk//51

      - name: Fetch the verified Vulkan provider
        run: python3 providers/vulkan-dlssg/distribution.py --output windows/out/vulkan-provider

      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          python3 packaging/build_flatpak.py
          python3 - <<'PYBUILD'
          import json, os
          from pathlib import Path
          info=json.loads(Path('dist/flatpak-build/source/payload/BUILD_INFO.json').read_text())
          assert info['commit']==os.environ['GITHUB_SHA'], info
          PYBUILD
          cd dist
          sha256sum -c rtxForge-*-x86_64.flatpak.sha256

      - name: Verify the installed Flatpak
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -m 700 -p "$XDG_RUNTIME_DIR"
          flatpak install --user -y --noninteractive dist/rtxForge-*-x86_64.flatpak
          dbus-run-session -- python3 packaging/flatpak/verify_bundle.py --screenshot dist/flatpak-window.png

      - name: Create Beta Flatpak assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish_beta
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^1\.0\.0-beta\.[0-9]+$ ]]
          FLATPAK="rtxForge-${VERSION}-x86_64.flatpak"
          mkdir -p dist/beta-flatpak
          cp "dist/$FLATPAK" "dist/beta-flatpak/$FLATPAK"
          (cd dist/beta-flatpak && sha256sum "$FLATPAK" > "$FLATPAK.sha256")
          ls -l dist/beta-flatpak

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtxForge-Flatpak-x86_64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/rtxForge-*-x86_64.flatpak
            dist/rtxForge-*-x86_64.flatpak.sha256
            dist/flatpak-window.png
            dist/beta-flatpak/

  # Shares one concurrency group with the Windows publish-beta job: the two
  # workflows write to the same 'beta' release and must never interleave.
  # Policy: docs/linux/BETA-RELEASE.md.
  publish-beta:
    name: Publish Linux Beta
    needs: [build-appimage, build-flatpak]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_beta && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: rtxforge-beta-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download verified AppImage
        uses: actions/download-artifact@v4
        with:
          name: rtxForge-Bazzite-x86_64
          path: artifact

      - name: Download verified Flatpak
        uses: actions/download-artifact@v4
        with:
          name: rtxForge-Flatpak-x86_64
          path: flatpak-artifact

      - name: Publish exact build
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^1\.0\.0-beta\.[0-9]+$ ]]
          APPIMAGE="rtxForge-$VERSION-x86_64.AppImage"
          FLATPAK="rtxForge-$VERSION-x86_64.flatpak"
          BUILD_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          mkdir release
          cp artifact/beta/* flatpak-artifact/beta-flatpak/* release/
          (cd release && test "$(ls | wc -l)" = 5 && sha256sum -c "$APPIMAGE.sha256" && sha256sum -c "$FLATPAK.sha256")
          jq -e --arg sha "$GITHUB_SHA" --arg v "$VERSION" --arg a "$APPIMAGE" \
            '.channel == "beta" and .commit == $sha and .version == $v and .appimage == $a' \
            release/rtxforge-beta-linux.json

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/beta" > "$RUNNER_TEMP/existing-beta.json" 2> "$RUNNER_TEMP/beta-lookup-error"; then
            WINDOWS_BEFORE="$(python3 packaging/beta_release.py owned windows "$RUNNER_TEMP/existing-beta.json")"
            CURRENT="$(python3 packaging/beta_release.py owned linux "$RUNNER_TEMP/existing-beta.json")"
            if [ -n "$CURRENT" ]; then
              # Keep the Linux build being replaced as *.previous-<commit> rollback
              # copies, exactly as Windows does; the website and updaters ignore them.
              OLD_VERSION="$(sed -nE 's/^rtxForge-(1\.0\.0-beta\.[0-9]+)-x86_64\.AppImage$/\1/p' <<< "$CURRENT")"
              test -n "$OLD_VERSION" && test "$(wc -l <<< "$OLD_VERSION")" = 1
              test "${OLD_VERSION##*.}" -lt "${VERSION##*.}"
              # 3 files before the Flatpak joined the release, 5 since.
              CURRENT_COUNT="$(wc -l <<< "$CURRENT")"
              if [ "$CURRENT_COUNT" = 5 ]; then
                grep -qxF "rtxForge-$OLD_VERSION-x86_64.flatpak" <<< "$CURRENT"
                grep -qxF "rtxForge-$OLD_VERSION-x86_64.flatpak.sha256" <<< "$CURRENT"
              else
                test "$CURRENT_COUNT" = 3
              fi
              OLD_SHA="$(python3 packaging/beta_release.py source linux "$RUNNER_TEMP/existing-beta.json")"
              SUFFIX=".previous-${OLD_SHA:0:12}"
              mkdir -p "$RUNNER_TEMP/previous" "$RUNNER_TEMP/existing"
              while read -r NAME; do gh release download beta --dir "$RUNNER_TEMP/previous" --pattern "$NAME"; done <<< "$CURRENT"
              (cd "$RUNNER_TEMP/previous" && sha256sum -c "rtxForge-$OLD_VERSION-x86_64.AppImage.sha256")
              if [ "$CURRENT_COUNT" = 5 ]; then
                (cd "$RUNNER_TEMP/previous" && sha256sum -c "rtxForge-$OLD_VERSION-x86_64.flatpak.sha256")
              fi
              jq -e --arg sha "$OLD_SHA" '.commit == $sha' "$RUNNER_TEMP/previous/rtxforge-beta-linux.json"
              for FILE in "$RUNNER_TEMP/previous"/*; do
                NAME="$(basename "$FILE")$SUFFIX"
                mv "$FILE" "$RUNNER_TEMP/previous/$NAME"
                if jq -e --arg n "$NAME" 'any(.assets[]; .name == $n)' "$RUNNER_TEMP/existing-beta.json" > /dev/null; then
                  gh release download beta --dir "$RUNNER_TEMP/existing" --pattern "$NAME"
                  cmp "$RUNNER_TEMP/previous/$NAME" "$RUNNER_TEMP/existing/$NAME"
                else
                  gh release upload beta "$RUNNER_TEMP/previous/$NAME"
                fi
              done
              # New packages first, then the manifest that points at the AppImage, then retire the old names.
              gh release upload beta "release/$APPIMAGE" "release/$APPIMAGE.sha256" "release/$FLATPAK" "release/$FLATPAK.sha256"
              gh release upload beta release/rtxforge-beta-linux.json --clobber
              while read -r NAME; do
                [ "$NAME" = rtxforge-beta-linux.json ] || gh release delete-asset beta "$NAME" -y
              done <<< "$CURRENT"
            else
              gh release upload beta release/*
            fi
            python3 packaging/beta_release.py notes linux docs/releases/1.0-beta.md "$RUNNER_TEMP/existing-beta.json" \
              "$VERSION" "$GITHUB_SHA" "$BUILD_URL" > "$RUNNER_TEMP/beta-notes.md"
            git tag -f beta "$GITHUB_SHA"
            git push -f origin refs/tags/beta
            gh release edit beta --draft=false --prerelease --latest=false --title 'rtxForge Beta 1' --notes-file "$RUNNER_TEMP/beta-notes.md"
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/beta-lookup-error"; then
            WINDOWS_BEFORE=''
            python3 packaging/beta_release.py notes linux docs/releases/1.0-beta.md - \
              "$VERSION" "$GITHUB_SHA" "$BUILD_URL" > "$RUNNER_TEMP/beta-notes.md"
            gh release create beta release/* --draft --prerelease --target "$GITHUB_SHA" --title 'rtxForge Beta 1' --notes-file "$RUNNER_TEMP/beta-notes.md"
            gh release edit beta --draft=false --prerelease --latest=false
          else
            cat "$RUNNER_TEMP/beta-lookup-error" >&2
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/tags/beta" > "$RUNNER_TEMP/published-beta.json"
          test "$(python3 packaging/beta_release.py owned linux "$RUNNER_TEMP/published-beta.json" | sort)" = "$(printf '%s\n' "$APPIMAGE" "$APPIMAGE.sha256" "$FLATPAK" "$FLATPAK.sha256" rtxforge-beta-linux.json | sort)"
          test "$(python3 packaging/beta_release.py owned windows "$RUNNER_TEMP/published-beta.json")" = "$WINDOWS_BEFORE"
          test "$(python3 packaging/beta_release.py source linux "$RUNNER_TEMP/published-beta.json")" = "$GITHUB_SHA"
