name: Package UI review
on:
  pull_request:
    paths: ['gui/**', 'scripts/**', 'engine/**', 'tests/**', '.github/workflows/package-ui-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-review:
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 20
    steps:
      - run: dnf install -y git python3 python3-pytest python3-gobject gobject-introspection gtk4 libadwaita graphene gdk-pixbuf2 adwaita-icon-theme adwaita-sans-fonts xorg-x11-server-Xvfb dbus-daemon
      - uses: actions/checkout@v4
      - name: Validate package engine and syntax
        run: |
          python3 -m compileall -q scripts gui engine
          python3 -m pytest tests/test_package_catalog.py tests/test_package_download.py tests/test_package_cache.py -q
          python3 -m unittest engine.tests.test_v13_core_hardening
      - name: Capture both real native layouts without game writes
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          LIBGL_ALWAYS_SOFTWARE: '1'
          GTK_A11Y: none
          HOME: /tmp/rtxforge-review-home
        run: |
          mkdir -p "$HOME" dist
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' python3 tests/ui_package_review.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rtxforge-native-package-review
          path: dist/
          retention-days: 7
