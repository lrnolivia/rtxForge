name: Build shared native overlays

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native:
    name: In-game panel candidate
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Skynizz/optiscaler-dlss5
          ref: fc702f8ca22f97b01bd6a02f3386bffb3484fc35
          submodules: recursive
          persist-credentials: false
          path: windows/out/skynizz-source
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/checkout@v4
        with:
          repository: mikke89/RmlUi
          ref: ae4e0dcb52b324a0d0fc36ed51f633c8c3fe06b7
          persist-credentials: false
          path: windows/out/rmlui-source
      - name: Build and validate the shared glass renderer
        run: ./windows/build/Build-GlassOverlay.ps1 -RmlSource windows/out/rmlui-source -FreetypeRoot windows/out/skynizz-source/external/freetype
      - name: Build isolated renderer candidate
        run: ./windows/build/Build-SkynizzBridge.ps1 -SourceRoot windows/out/skynizz-source -PanelCandidate -GlassOverlay windows/out/glass-overlay
      - uses: actions/upload-artifact@v4
        with:
          name: glass-overlay-candidate
          path: |
            windows/out/glass-overlay/rtxforge-glass.dll
            windows/out/glass-overlay/package.json
            windows/out/glass-overlay/notices/**
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: skynizz-in-game-panel-candidate
          path: |
            windows/out/skynizz-panel-candidate/*.zip
            windows/out/skynizz-panel-candidate/package.json
          if-no-files-found: error
          retention-days: 14
      - name: Build Feeder with the matching glass renderer
        run: ./windows/build/Build-FeederPanel.ps1 -SourceRoot windows/out/skynizz-source -GlassOverlay windows/out/glass-overlay
      - uses: actions/upload-artifact@v4
        with:
          name: feeder-overlay-candidate
          path: |
            windows/out/feeder-panel/*.addon64
            windows/out/feeder-panel/rtxforge-glass.dll
            windows/out/feeder-panel/package.json
            windows/out/feeder-panel/*txt
            windows/out/feeder-panel/glass-notices/**
          if-no-files-found: error
          retention-days: 14
